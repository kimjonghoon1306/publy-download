<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151019"/><stop offset="55%" stop-color="#110d16"/><stop offset="100%" stop-color="#0d0a11"/>
    </linearGradient>
    <radialGradient id="gE" cx="16%" cy="22%" r="55%"><stop offset="0%" stop-color="#ff5a3c" stop-opacity=".28"/><stop offset="100%" stop-color="#ff5a3c" stop-opacity="0"/></radialGradient>
    <radialGradient id="gP" cx="88%" cy="90%" r="58%"><stop offset="0%" stop-color="#f0417a" stop-opacity=".26"/><stop offset="100%" stop-color="#f0417a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gV" cx="74%" cy="14%" r="42%"><stop offset="0%" stop-color="#6d3bff" stop-opacity=".18"/><stop offset="100%" stop-color="#6d3bff" stop-opacity="0"/></radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff7a5c"/><stop offset="55%" stop-color="#f0417a"/><stop offset="100%" stop-color="#ff9ec4"/></linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff8a6c"/><stop offset="55%" stop-color="#f26499"/><stop offset="100%" stop-color="#ffb0cf"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#gE)"/>
  <rect width="1200" height="630" fill="url(#gP)"/>
  <rect width="1200" height="630" fill="url(#gV)"/>

  <!-- 미세 그리드 -->
  <g opacity="0.035" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="210" x2="1200" y2="210"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
  </g>

  <!-- 상단 브랜드 (안전영역 안, y 충분히 아래) -->
  <g transform="translate(80,66)">
    <rect x="0" y="0" width="44" height="44" rx="13" fill="url(#mark)"/>
    <text x="22" y="32" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900" fill="#fff">P</text>
    <text x="60" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="4" fill="#efe9ef">PUBLY</text>
  </g>

  <!-- 배지 -->
  <g transform="translate(80,150)">
    <rect x="0" y="0" width="272" height="40" rx="20" fill="rgba(255,255,255,0.05)" stroke="rgba(242,100,153,0.5)" stroke-width="1.4"/>
    <circle cx="25" cy="20" r="4.5" fill="#ff7a5c"/>
    <text x="42" y="27" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1" fill="#ccc6d2">AI 블로그 · 트래픽 자동화</text>
  </g>

  <!-- 메인 카피 -->
  <text x="78" y="288" font-family="Arial Black, Arial, sans-serif" font-size="70" font-weight="900" letter-spacing="-3" fill="#efe9ef">당신이 잠든 사이,</text>
  <text x="78" y="366" font-family="Arial Black, Arial, sans-serif" font-size="70" font-weight="900" letter-spacing="-3" fill="url(#hl)">블로그가 일합니다.</text>

  <!-- 서브 카피 -->
  <text x="80" y="424" font-family="Arial, sans-serif" font-size="23" font-weight="500" fill="#9c96a4">키워드 하나로 제목·글·이미지·발행까지. 순위를 올리는 진짜 트래픽까지.</text>

  <!-- 제품 칩 2개 -->
  <g transform="translate(80,470)">
    <rect x="0" y="0" width="228" height="64" rx="16" fill="rgba(255,122,92,0.10)" stroke="rgba(255,122,92,0.3)" stroke-width="1.3"/>
    <rect x="20" y="16" width="32" height="32" rx="9" fill="url(#mark)"/>
    <text x="36" y="39" text-anchor="middle" font-family="Arial Black" font-size="18" font-weight="900" fill="#fff">P</text>
    <text x="66" y="29" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#efe9ef">퍼블리</text>
    <text x="66" y="50" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ff9a72">AI 자동 발행</text>

    <rect x="248" y="0" width="250" height="64" rx="16" fill="rgba(242,100,153,0.10)" stroke="rgba(242,100,153,0.3)" stroke-width="1.3"/>
    <rect x="268" y="16" width="32" height="32" rx="9" fill="url(#hl)"/>
    <text x="284" y="39" text-anchor="middle" font-family="Arial Black" font-size="18" font-weight="900" fill="#fff">T</text>
    <text x="314" y="29" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#efe9ef">퍼블리 트래픽</text>
    <text x="314" y="50" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ff9ec4">검색 순위 상승</text>
  </g>

  <!-- 우측 마스코트 (세로 중앙, 안전) -->
  <g transform="translate(950,215)">
    <ellipse cx="70" cy="212" rx="82" ry="15" fill="#000" opacity="0.22"/>
    <circle cx="70" cy="110" r="140" fill="url(#mark)" opacity="0.10" filter="url(#soft)"/>
    <line x1="70" y1="34" x2="70" y2="14" stroke="url(#mark)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="70" cy="11" r="8.5" fill="url(#mark)"/>
    <rect x="4" y="34" width="132" height="132" rx="50" fill="url(#mark)"/>
    <rect x="26" y="60" width="88" height="66" rx="32" fill="#0d0a11" opacity="0.9"/>
    <circle cx="54" cy="90" r="11" fill="#fff"/><circle cx="86" cy="90" r="11" fill="#fff"/>
    <circle cx="57" cy="92" r="4.3" fill="#0d0a11"/><circle cx="89" cy="92" r="4.3" fill="#0d0a11"/>
    <path d="M60 106 q10 11 22 0" stroke="#ffb0cf" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <rect x="44" y="162" width="17" height="26" rx="8.5" fill="url(#mark)"/>
    <rect x="80" y="162" width="17" height="26" rx="8.5" fill="url(#mark)"/>
  </g>

  <!-- 하단 -->
  <text x="80" y="580" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#6c6672">pdown.blogautopro.com</text>
  <g transform="translate(990,558)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="url(#hl)"/>
    <text x="65" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#fff">🎁 7일 무료</text>
  </g>
</svg>
