<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0a12"/><stop offset="55%" stop-color="#0a0810"/><stop offset="100%" stop-color="#08070b"/>
    </linearGradient>
    <radialGradient id="gE" cx="14%" cy="16%" r="52%"><stop offset="0%" stop-color="#ff5a3c" stop-opacity=".5"/><stop offset="100%" stop-color="#ff5a3c" stop-opacity="0"/></radialGradient>
    <radialGradient id="gP" cx="90%" cy="94%" r="55%"><stop offset="0%" stop-color="#f0417a" stop-opacity=".45"/><stop offset="100%" stop-color="#f0417a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gV" cx="72%" cy="8%" r="40%"><stop offset="0%" stop-color="#6d3bff" stop-opacity=".3"/><stop offset="100%" stop-color="#6d3bff" stop-opacity="0"/></radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff6a48"/><stop offset="55%" stop-color="#f0417a"/><stop offset="100%" stop-color="#ff7ab0"/></linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff6a48"/><stop offset="55%" stop-color="#f0417a"/><stop offset="100%" stop-color="#ff9ec4"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#gE)"/>
  <rect width="1200" height="630" fill="url(#gP)"/>
  <rect width="1200" height="630" fill="url(#gV)"/>

  <!-- 미세 그리드 라인 -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/><line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- 상단 브랜드 -->
  <g transform="translate(80,72)">
    <rect x="0" y="0" width="46" height="46" rx="13" fill="url(#mark)" filter="url(#soft)" opacity="0.6"/>
    <rect x="0" y="0" width="46" height="46" rx="13" fill="url(#mark)"/>
    <text x="23" y="33" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="27" font-weight="900" fill="#fff">P</text>
    <text x="62" y="32" font-family="Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="4" fill="#f4f0ee">PUBLY</text>
  </g>

  <!-- 배지 -->
  <g transform="translate(80,168)">
    <rect x="0" y="0" width="270" height="42" rx="21" fill="none" stroke="url(#hl)" stroke-width="1.6" opacity="0.9"/>
    <circle cx="26" cy="21" r="5" fill="#ff5a3c"/>
    <text x="44" y="28" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1" fill="#c9c3cf">AI 블로그 · 트래픽 자동화</text>
  </g>

  <!-- 메인 카피 -->
  <text x="78" y="310" font-family="Arial Black, Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="-3" fill="#f4f0ee">당신이 잠든 사이,</text>
  <text x="78" y="392" font-family="Arial Black, Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="-3" fill="url(#hl)">블로그가 일합니다.</text>

  <!-- 서브 카피 -->
  <text x="80" y="452" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#9a94a2">키워드 하나로 제목·글·이미지·발행까지. 그리고 순위를 올리는 진짜 트래픽까지.</text>

  <!-- 제품 칩 2개 -->
  <g transform="translate(80,500)">
    <rect x="0" y="0" width="230" height="66" rx="16" fill="rgba(255,90,60,0.12)" stroke="rgba(255,90,60,0.35)" stroke-width="1.4"/>
    <rect x="20" y="17" width="32" height="32" rx="9" fill="url(#mark)"/>
    <text x="36" y="40" text-anchor="middle" font-family="Arial Black" font-size="19" font-weight="900" fill="#fff">P</text>
    <text x="66" y="30" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#f4f0ee">퍼블리</text>
    <text x="66" y="52" font-family="Arial, sans-serif" font-size="13.5" font-weight="600" fill="#ff8a4c">AI 자동 발행</text>

    <rect x="250" y="0" width="250" height="66" rx="16" fill="rgba(240,65,122,0.12)" stroke="rgba(240,65,122,0.35)" stroke-width="1.4"/>
    <rect x="270" y="17" width="32" height="32" rx="9" fill="url(#hl)"/>
    <text x="286" y="40" text-anchor="middle" font-family="Arial Black" font-size="19" font-weight="900" fill="#fff">T</text>
    <text x="316" y="30" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#f4f0ee">퍼블리 트래픽</text>
    <text x="316" y="52" font-family="Arial, sans-serif" font-size="13.5" font-weight="600" fill="#ff7ab0">검색 순위 상승</text>
  </g>

  <!-- 우측 마스코트 -->
  <g transform="translate(930,300)">
    <ellipse cx="70" cy="230" rx="90" ry="18" fill="#000" opacity="0.28"/>
    <circle cx="70" cy="120" r="150" fill="url(#mark)" opacity="0.14" filter="url(#soft)"/>
    <!-- 안테나 -->
    <line x1="70" y1="30" x2="70" y2="8" stroke="url(#mark)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="70" cy="6" r="9" fill="url(#mark)"/>
    <!-- 몸통 -->
    <rect x="0" y="30" width="140" height="140" rx="52" fill="url(#mark)"/>
    <!-- 얼굴 -->
    <rect x="22" y="56" width="96" height="72" rx="34" fill="#0d0810" opacity="0.92"/>
    <circle cx="52" cy="90" r="12" fill="#fff"/><circle cx="88" cy="90" r="12" fill="#fff"/>
    <circle cx="55" cy="92" r="4.6" fill="#0d0810"/><circle cx="91" cy="92" r="4.6" fill="#0d0810"/>
    <path d="M58 108 q12 12 24 0" stroke="#ff9ec4" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- 다리 -->
    <rect x="42" y="166" width="18" height="28" rx="9" fill="url(#mark)"/>
    <rect x="80" y="166" width="18" height="28" rx="9" fill="url(#mark)"/>
  </g>

  <!-- 하단 도메인/무료 -->
  <text x="80" y="600" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#6b6570">pdownload.blogautopro.com</text>
  <g transform="translate(980,576)">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="url(#hl)"/>
    <text x="70" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">🎁 7일 무료</text>
  </g>
</svg>
